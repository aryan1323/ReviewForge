# Development overrides: hot reload + bind mounts
services:
  api:
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      LOG_LEVEL: DEBUG

  worker:
    volumes:
      - ./backend:/app
    environment:
      LOG_LEVEL: DEBUG
